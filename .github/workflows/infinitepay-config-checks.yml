name: InfinitePay configuration checks

on:
  push:
    branches:
      - feature/infinitepay-checkout
  pull_request:

permissions:
  contents: read

jobs:
  validate-configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Node syntax and production configuration tests
        run: |
          node --check src/config/resolveFinancialEnvironment.js
          node --check src/config/postgresConnection.js
          node --check src/config/infinitepayProduction.js
          node --check src/server.js
          node --check knexfile.js
          node --check scripts/diagnose-infinitepay-local.js
          node --check scripts/diagnose-infinitepay-boot.js
          node --check src/database/seeds/14_infinitepay_admin_access.js
          node --check src/utils/infinitepayAdminSeedPolicy.js
          node --test tests/resolveFinancialEnvironment.test.js tests/postgresConnection.test.js tests/infinitepayRenderConfig.test.js tests/infinitepayLocalTunnel.test.js tests/infinitepayAdminSeedPolicy.test.js tests/financialPermissionChanges.test.js
